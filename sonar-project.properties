# SonarQube Cloud (sonarcloud.io) — free for public repositories.
# projectKey / organization are assigned when you import the repo in SonarCloud;
# for a GitHub import they default to the values below. Adjust if yours differ.
sonar.projectKey=biswajitdas-007_tally
sonar.organization=biswajitdas-007
sonar.projectName=Tally

# What to analyze
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Keep generated output, tooling, and assets out of the analysis
sonar.exclusions=**/node_modules/**,.next/**,public/**,scripts/**,**/*.config.*,**/*.d.ts

# Coverage — generated by `npm run test:coverage` in the Sonar workflow.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage is measured on the pure-logic layer, which is what the suite tests.
# Everything below needs a browser, a database or a network to exercise, and we
# have no harness for any of them — counting it would report a number nobody can
# act on rather than a gap worth closing.
sonar.coverage.exclusions=**/*.tsx,src/hooks/**,src/store/**,src/app/**,src/lib/db.ts,src/lib/mongodb.ts,src/lib/firebase*.ts,src/lib/push.ts,src/lib/mailer.ts,src/lib/pusher.ts
